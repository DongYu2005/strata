intro = "这是一个由地区、村、人组成的世界。每个人有几样特质：TA 走到跟前就看得见，TB 要和他做过一单才知道。\n每天你在昨天所在的村醒来，接到一个任务：找一个特质符合要求的人做一单。别村的人现在什么样，只能凭记忆。\n同一地区里换村，当天就到；去别的地区，路上要走一天。\n人的特质会变，村的会变，地区的也会变，只是越大的变得越慢。\n一世到头，世界照常运转；你会在随便哪个村重新开始，之前的事都还记得。"

