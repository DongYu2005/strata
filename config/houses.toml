# 四层的世界：地区 → 村 → 户 → 人。每村 4 户、每户 2 人，两个隐藏特质。
# 一家人往往一个样，所以和一个人打过交道，对他家里人也该有个数；户比人变得慢，比村变得快。
# 规则基线（4 世 × 40 天，10 个 seed），都是每村 8 人、两个隐藏特质：
#   不分户 ratio 5（more-memory）  随便找 22%  只信最新 36%  分层推断 50%  全知 80%   推断−随便 +28  全知−推断 +30
#   不分户 ratio 3                 随便找 31%  只信最新 45%  分层推断 53%  全知 85%   推断−随便 +22  全知−推断 +32
#   本配置（分户 ratio 3）         随便找 20%  只信最新 40%  分层推断 55%  全知 88%   推断−随便 +35  全知−推断 +33
#   分户 ratio 5                   随便找 24%  只信最新 52%  分层推断 65%  全知 91%   推断−随便 +41  全知−推断 +26
# ratio 取 3：多了一层，最上面的地区还是几百天变一回，和三层的默认世界差不多；取 5 的话整个世界都更慢。
# 用法：uv run stratabench --config config/houses.toml
#       node dsh/run.mjs --config config/houses.toml ...

worldview = "config/worldview-2hidden.toml"

[world]
size = [3, 3, 4, 2]     # 地区数、每个地区几个村、每个村几户、每户几个人
ratio = 3               # 人 10 ~ 30 天变一回，户 30 ~ 90，村 90 ~ 270，地区 270 ~ 810

[game]                  # 和 11.03 评测一致：4 世 × 40 天
lives = 4
life = 40
gap = 300

[view]                  # 盖在世界观上：开场白说明有户，多一份户的名字和一句台词
intro = """你是给东家跑货的采办，走村串户。每天在昨天落脚的村子醒来，东家的口信就到了：要一样货，
还得是从守信、卖真货的人手里买。谁的摊上摆着什么，走到跟前一眼就看得见；别村的摊子，只能凭记忆。
同一地区里串村，当天就到；翻山去别的地区，路上要走一天。谁守信、谁短秤，谁卖真货、谁掺假，只有真做过买卖、回去验过货才知道。
村里的人分住在几户人家，一家人往往一个样。
人心会变，一家的门风会变，村里的风气会变，一个地方的行情也会变，只是越大的地方变得越慢。
一世到头，你会死去，世间照常流转；你会在随便哪个村醒来，前世的事都还记得。"""
houses = ["赵家", "钱家", "孙家", "李家", "周家", "吴家", "郑家", "王家", "冯家", "陈家", "褚家", "卫家", "蒋家", "沈家", "韩家", "杨家", "朱家", "秦家", "尤家", "许家", "何家", "吕家", "施家", "张家", "孔家", "曹家", "严家", "华家", "金家", "魏家", "陶家", "姜家", "戚家", "谢家", "邹家", "喻家", "柏家", "水家", "窦家", "章家"]

[view.lines]
house = "{house}——{stalls}"         # 一户的摊子：{stalls} 是这户每个人的那句 stall
