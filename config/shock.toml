# 有变故的世界：一个地区或一个村偶尔突然整个换样，当天有消息传来。
# 考的是听到消息后会不会改主意：那里的人，哪怕没再见过，印象也该跟着换。
# 规则基线听不到消息，总分变化不大（4 世 × 40 天，10 个 seed）：
#   随便找 35%  只信最新 49%  分层推断 61%  全知 85%
# 要看的是消息之后的那几天（20 个 seed，每局约 8 条关于隐藏特质的消息）。传来「那里人人短秤」之后 10 天：
#   听不到消息的基线照样去找那里的人做了 30 ~ 80 单，只成 0 ~ 7%；把消息记下来用的，一单都不去做。
#   传来「那里人人守信」之后 10 天：会用消息的去那里做了 170 ~ 190 单，不会用的只有 50 ~ 60 单。
# 用法：uv run stratabench --config config/shock.toml
#       node dsh/run.mjs --config config/shock.toml ...

[world]
shock = [0.002, 0.01]   # 每天每个地区、每个村出变故的概率：地区约 500 天一回，村约 100 天一回

[game]                  # 和 11.03 评测一致：4 世 × 40 天
lives = 4
life = 40
gap = 300
