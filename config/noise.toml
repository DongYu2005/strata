# 有失手的世界：守信的人偶尔短秤，短秤的人偶尔也给足分量。一回的结果不能全信。
# 规则基线（4 世 × 40 天，10 个 seed）：
#   noise 0    随便找 40%  只信最新 53%  只信多数 48%  分层推断 65%  全知 84%
#   noise 0.1  随便找 39%  只信最新 42%  只信多数 46%  分层推断 56%  全知 76%
#   noise 0.2  随便找 39%  只信最新 34%  只信多数 42%  分层推断 49%  全知 67%
# 失手不会拉大「推断 − 随便找」，它拉开的是「把几回合起来看」和「上回什么样就认定什么样」：
# 只信最新从比随便找高 13 个点掉到和随便找差不多，noise 0.2 起反而更差。noise 再大，谁都学不到东西。
# 用法：uv run stratabench --config config/noise.toml
#       node dsh/run.mjs --config config/noise.toml ...

[game]                  # 和 11.03 评测一致：4 世 × 40 天
lives = 4
life = 40
gap = 300
noise = 0.1             # 每样隐藏特质，这一回的表现以这个概率和本性不一样

[view]                  # 盖在默认世界观上：开场白多一句，告诉采办人会失手
intro = """你是给东家跑货的采办，走村串户。每天在昨天落脚的村子醒来，东家的口信就到了：要一样货，
还得是从守信的人手里买。谁的摊上摆着什么，走到跟前一眼就看得见；别村的摊子，只能凭记忆。
同一地区里串村，当天就到；翻山去别的地区，路上要走一天。谁守信、谁短秤，只有真做过买卖、回去过了秤才知道。
人也有失手的时候：守信的人偶尔短秤，短秤的人偶尔也给足分量，一回的结果不能全信。
人心会变，村里的风气会变，一个地方的行情也会变，只是越大的地方变得越慢。
一世到头，你会死去，世间照常流转；你会在随便哪个村醒来，前世的事都还记得。"""
